name: Release to NuGet

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    permissions: 
      id-token: write
      
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/Obfuscator.csproj
  
      - name: Build
        run: dotnet build src/Obfuscator.csproj --configuration Release --no-restore
  
      - name: Pack
        run: dotnet pack src/Obfuscator.csproj --configuration Release --no-build --output ./nupkg

      - name: NuGet Login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
            
        
